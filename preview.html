<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿米娅 · 寰宇独奏</title>
<style>body{margin:0;background:#111827;color:#e5e7eb;font:16px system-ui;text-align:center}main{max-width:900px;margin:45px auto;padding:20px}h1{font-size:27px}p{color:#aab7ce}#stage{height:380px;display:grid;place-items:center;background:radial-gradient(ellipse,#334060,#182238);border-radius:20px;margin:25px 0}#pet{width:192px;height:208px;background-image:url('pet/spritesheet.webp');background-size:1536px 2288px}button{background:#263553;color:#fff;border:1px solid #516184;border-radius:9px;padding:10px 16px;margin:5px;cursor:pointer}button.active{background:#495bbc}label{display:inline-block;margin:14px}a{color:#a5b4fc}</style>
<main><h1>阿米娅 · 寰宇独奏</h1><p>选择动作预览；开启注视后，在展示区域移动鼠标。</p><div id="stage"><div id="pet"></div></div><nav id="buttons"></nav><label><input id="gaze" type="checkbox"> 随鼠标注视</label><p><a href="README.md">安装说明</a> · 非官方同人宠物 · 使用 Codex 制作</p></main>
<script>
const names=['待机','向右移动','向左移动','挥手','跳跃','失落','等待回应','工作中','查看结果'];
const timing=[[280,110,110,140,140,320],[120,120,120,120,120,120,120,220],[120,120,120,120,120,120,120,220],[140,140,140,280],[140,140,140,140,280],[140,140,140,140,140,140,140,240],[150,150,150,150,150,260],[120,120,120,120,120,220],[150,150,150,150,150,280]];
let row=0,frame=0,last=0,look=null;const pet=document.querySelector('#pet'),gaze=document.querySelector('#gaze'),stage=document.querySelector('#stage');
names.forEach((name,i)=>{let b=document.createElement('button');b.textContent=name;b.className=i===0?'active':'';b.onclick=()=>{row=i;frame=0;last=performance.now();document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))};document.querySelector('#buttons').append(b)});
stage.onmousemove=e=>{let r=pet.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;if(Math.hypot(dx,dy)<28){look=null;return}look=Math.round(((Math.atan2(dx,-dy)*180/Math.PI+360)%360)/22.5)%16};stage.onmouseleave=()=>look=null;
function tick(t){if(gaze.checked&&look!==null){pet.style.backgroundPosition=`${-(look%8)*192}px ${-(9+Math.floor(look/8))*208}px`}else{if(t-last>timing[row][frame]){frame=(frame+1)%timing[row].length;last=t}pet.style.backgroundPosition=`${-frame*192}px ${-row*208}px`}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
